<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>VR AI Assistant - Admin Test Panel</title>
    <style>
        :root { --primary: #00d2ff; --bg: #0f0f0f; --card: #1e1e1e; --success: #00ff88; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; display: flex; justify-content: center; padding: 20px; }
        .panel { background: var(--card); padding: 25px; border-radius: 15px; width: 100%; max-width: 600px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .config-bar { display: flex; gap: 10px; margin-bottom: 20px; background: #2a2a2a; padding: 10px; border-radius: 8px; }
        input { background: #333; border: 1px solid #444; color: white; padding: 10px; border-radius: 4px; outline: none; }
        input:focus { border-color: var(--primary); }
        .ip-input { flex: 2; }
        .port-input { flex: 1; }

        .input-group { display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; }
        .text-row { display: flex; gap: 10px; }
        #textQuery { flex: 1; border-left: 3px solid var(--primary); }
        
        button { padding: 12px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; transition: 0.2s; }
        .btn-text { background: var(--primary); color: #000; }
        
        #recordBtn { 
            width: 100%; padding: 30px; font-size: 1.2rem; 
            background: #333; color: white; border: 2px solid #444;
            user-select: none; -webkit-user-select: none;
            cursor: pointer;
        }
        #recordBtn.recording { 
            background: var(--success) !important; 
            color: black !important; 
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
        }

        #resultBox { 
            background: #000; border: 1px solid #333; padding: 15px; border-radius: 8px; 
            min-height: 150px; white-space: pre-wrap; margin-top: 20px; line-height: 1.5;
        }
        .loader { display: none; border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; margin: 15px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Estilo para el link de certificado */
        .cert-link { color: var(--primary); text-decoration: underline; cursor: pointer; margin-left: 5px; font-size: 0.8rem; }
    </style>
</head>
<body>

<div class="panel">
    <h2>🧠 fAIware</h2>
    
    <div id="statusInfo" style="text-align: center; color: #888; font-size: 0.9rem;"> 
        <span class="cert-link" onclick="openHealth()">[Validar Certificado]</span>
    </div>

    <div class="config-bar">
        <input type="text" id="ipAddr" class="ip-input" placeholder="Servidor IP" value="localhost">
        <input type="text" id="port" class="port-input" placeholder="Puerto" value="5000">
    </div> 

    <div class="input-group">
        <div class="text-row">
            <input type="text" id="textQuery" placeholder="Escribe tu consulta (ej: Motor)..." onkeypress="if(event.key==='Enter') sendText()">
            <button class="btn-text" onclick="sendText()">ENVIAR</button>
        </div>

        <hr style="width:100%; border:0; border-top:1px solid #333; margin: 10px 0;">

        <button id="recordBtn">MANTENER PARA HABLAR</button>
    </div>
    <div id="statusInfo" style="text-align: center; color: #888; font-size: 0.9rem;">
        <span id="status">Haz clic una vez para activar micrófono</span> 
    </div>


    <div class="loader" id="loader"></div>
    <div id="resultBox">Los resultados aparecerán aquí...</div>
</div>

<script>
    let mediaRecorder;
    let chunks = [];
    let audioStream = null;
    
    const recordBtn = document.getElementById('recordBtn');
    const status = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');
    const loader = document.getElementById('loader');

    // Función para abrir la salud del servidor y aceptar certificado
    function openHealth() {
        const ip = document.getElementById('ipAddr').value;
        const port = document.getElementById('port').value;
        window.open(`https://${ip}:${port}/health`, '_blank');
    }

    async function initMic() {
        if (!audioStream) {
            try {
                audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                status.innerText = "Micrófono listo (Presiona sin soltar)";
            } catch (err) {
                alert("Error al acceder al micrófono: " + err);
            }
        }
    }

    async function sendText() {
        const ip = document.getElementById('ipAddr').value;
        const port = document.getElementById('port').value;
        const query = document.getElementById('textQuery').value;
        if (!query) return;

        setLoading(true, "Consultando base de datos...");

        try {
            const response = await fetch(`https://${ip}:${port}/query`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query: query })
            });
            const data = await response.json();
            displayResult(query, data);
        } catch (err) {
            displayError(err);
        } finally {
            setLoading(false, "Entrada lista");
        }
    }

    async function startRecording(e) {
        e.preventDefault();
        await initMic();
        
        if (audioStream && (!mediaRecorder || mediaRecorder.state === 'inactive')) {
            chunks = [];
            mediaRecorder = new MediaRecorder(audioStream);
            mediaRecorder.ondataavailable = e => chunks.push(e.data);
            mediaRecorder.onstop = sendAudio;
            mediaRecorder.start();
            recordBtn.classList.add('recording');
            recordBtn.innerText = "GRABANDO...";
            status.innerText = "Escuchando...";
        }
    }

    function stopRecording() {
        if (mediaRecorder && mediaRecorder.state === 'recording') {
            mediaRecorder.stop();
            recordBtn.classList.remove('recording');
            recordBtn.innerText = "MANTENER PARA HABLAR";
        }
    }

    recordBtn.addEventListener('mousedown', startRecording);
    recordBtn.addEventListener('mouseup', stopRecording);
    recordBtn.addEventListener('mouseleave', stopRecording);
    recordBtn.addEventListener('touchstart', startRecording);
    recordBtn.addEventListener('touchend', stopRecording);

    async function sendAudio() {
        const ip = document.getElementById('ipAddr').value;
        const port = document.getElementById('port').value;
        const blob = new Blob(chunks, { type: 'audio/wav' });
        const formData = new FormData();
        formData.append('audio', blob, 'query.wav');

        setLoading(true, "Procesando audio e IA...");

        try {
            const response = await fetch(`https://${ip}:${port}/query_audio`, {
                method: 'POST',
                body: formData
            });
            const data = await response.json();
            displayResult(data.transcription, data);
        } catch (err) {
            displayError(err);
        } finally {
            setLoading(false, "Micrófono listo");
        }
    }

    function displayResult(query, data) {
        const pages = data.sources ? data.sources.map(s => s.page).join(', ') : (data.pages || "N/A");
        resultBox.innerHTML = `
            <p><strong>Pregunta:</strong> ${query}</p>
            <hr style="border-color:#222">
            <p style="color:var(--primary)"><strong>IA:</strong> ${data.answer}</p>
            <p><small style="color:#888">Páginas: ${pages}</small></p>
            <p><small style="color:#444">Modelo: ${data.model_used || '...'}</small></p>
        `;
    }

    function displayError(err) {
        resultBox.innerHTML = `
            <span style="color:#ff3366">Error de conexión.</span><br>
            <button onclick="openHealth()" style="margin-top:10px; background:#444; color:white; padding:5px 10px; font-size:0.7rem;">
                CLICK AQUÍ PARA AUTORIZAR CERTIFICADO
            </button>
        `;
    }

    function setLoading(isLoading, msg) {
        loader.style.display = isLoading ? 'block' : 'none';
        status.innerText = msg;
    }
</script>

</body>
</html>
